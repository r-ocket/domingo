name: Build and Deploy to Development Server

on:
  push:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  EC2_HOST_DEV: ${{ vars.EC2_HOST_DEV }}
  EC2_USERNAME_DEV: ${{ vars.EC2_USERNAME_DE }}
  BINARY_NAME: domingo
  DOMINGO_HOME: /opt/domingo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - uses: actions/setup-node@v3
        with:
          node-version: "22"
      
      - name: Install dependencies and build CSS
        run: |
          npm install
          npm run css:build
      
      - name: Build Release Binary
        run: cargo build --release
      
      - name: Package Release
        run: |
          zip -r domingo_release.zip \
            src/templates \
            static \
            migrations \
            target/release/${{ env.BINARY_NAME }}
      
      - name: Upload Release Bundle
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.EC2_HOST_DEV }}
          username: ${{ env.EC2_USERNAME_DEV }}
          key: ${{ secrets.EC2_SSH_KEY_DEV }}
          source: domingo_release.zip
          target: /tmp
      
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST_DEV }}
          username: ${{ env.EC2_USERNAME_DEV }}
          key: ${{ secrets.EC2_SSH_KEY_DEV }}
          script: |
            # Stop service
            sudo systemctl stop domingo || true
            
            # Prepare directory
            sudo mkdir -p ${{ env.DOMINGO_HOME }}
            sudo chown ${{ env.EC2_USERNAME_DEV }}:${{ env.EC2_USERNAME_DEV }} ${{ env.DOMINGO_HOME }}
            cd ${{ env.DOMINGO_HOME }}
            
            # Clean and extract
            rm -rf src/templates static migrations ${{ env.BINARY_NAME }}
            unzip -o /tmp/domingo_release.zip
            mv target/release/${{ env.BINARY_NAME }} .
            chmod +x ${{ env.BINARY_NAME }}
            
            # Cleanup
            rm -rf /tmp/domingo_release.zip target
            
            # Restart service
            sudo systemctl daemon-reload
            sudo systemctl restart domingo
      
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST_DEV }}
          username: ${{ env.EC2_USERNAME_DEV }}
          key: ${{ secrets.EC2_SSH_KEY_DEV }}
          script: |
            echo "=== Service Status ==="
            systemctl status domingo --no-pager
            echo ""
            echo "=== Recent Logs ==="
            journalctl -u domingo -n 30 --no-pager

