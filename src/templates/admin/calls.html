{% extends "base.html" %}

{% block content %}
<div class="app-shell">
    {% include "partials/sidebar.html" %}
    
    <main class="main-content" :class="sidebarOpen ? 'sidebar-open' : 'sidebar-collapsed'">
        <div class="page-container" x-data="callCenter()">
            <!-- Page Header -->
            <header class="page-header">
                <div>
                    <h1 class="page-title">Centro de Llamadas</h1>
                    <p class="page-subtitle">Monitoreo en vivo de llamadas activas</p>
                </div>
                <div class="page-actions">
                    <span class="flex items-center gap-2 text-sm">
                        <span class="status-dot" :class="connected ? 'status-dot-green' : 'status-dot-red'"></span>
                        <span class="text-stone-400" x-text="connected ? 'Conectado' : 'Desconectado'"></span>
                    </span>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left Panel: Active Calls List + Initiate Call -->
                <div class="space-y-6">
                    <!-- Initiate Call Card -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">📞 Iniciar Llamada</h2>
                        </div>
                        <form @submit.prevent="initiateCall()" class="space-y-4">
                            <div class="form-group">
                                <label class="form-label">Adulto Mayor</label>
                                <select x-model="callForm.elder_id" class="form-select" required>
                                    <option value="">Seleccionar...</option>
                                    <template x-for="e in elders" :key="e.id">
                                        <option :value="e.id" x-text="e.name + ' (' + e.phone_number + ')'"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Motor de Voz</label>
                                <select x-model="callForm.voice_provider" class="form-select">
                                    <option value="openai_realtime">GPT-Realtime (OpenAI)</option>
                                    <option value="elevenlabs">ElevenLabs (Claude 4.5)</option>
                                </select>
                                <p class="form-hint text-xs mt-1" x-show="callForm.voice_provider === 'elevenlabs'">
                                    Usa Flash 2.5 con voz Juan Campillo y Claude Sonnet 4.5
                                </p>
                            </div>
                            <button type="submit" class="btn btn-primary w-full" :disabled="calling || !callForm.elder_id">
                                <span x-show="!calling">Iniciar Llamada</span>
                                <span x-show="calling">Iniciando...</span>
                            </button>
                        </form>
                        <div x-show="callError" class="mt-3 p-2 bg-red-500/10 rounded text-red-400 text-sm" x-text="callError"></div>
                    </div>

                    <!-- Active Calls List -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">Llamadas Activas</h2>
                            <span class="badge badge-primary" x-text="activeCalls.length"></span>
                        </div>
                        
                        <div x-show="activeCalls.length === 0" class="py-8 text-center text-stone-500">
                            <p>No hay llamadas activas</p>
                        </div>
                        
                        <div class="space-y-2">
                            <template x-for="call in activeCalls" :key="call.call_sid">
                                <button 
                                    @click="selectCall(call.call_sid)"
                                    class="w-full p-3 rounded border transition-colors text-left"
                                    :class="selectedCallSid === call.call_sid 
                                        ? 'bg-primary-500/10 border-primary-500/50' 
                                        : 'bg-surface-800/50 border-surface-700/50 hover:bg-surface-800'"
                                >
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="font-medium text-stone-100" x-text="call.elder_name"></span>
                                        <span class="status-dot" :class="call.status === 'active' ? 'status-dot-green' : 'status-dot-yellow'"></span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs text-stone-500">
                                        <span x-text="call.elder_phone"></span>
                                        <span x-text="formatDuration(call.started_at)"></span>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Recent/Ended Calls -->
                    <div class="card" x-show="endedCalls.length > 0">
                        <div class="card-header">
                            <h2 class="card-title text-stone-500">Llamadas Recientes</h2>
                        </div>
                        <div class="space-y-2">
                            <template x-for="call in endedCalls.slice(0, 5)" :key="call.call_sid">
                                <button 
                                    @click="selectCall(call.call_sid)"
                                    class="w-full p-3 rounded bg-surface-800/30 border border-surface-700/30 text-left opacity-60 hover:opacity-100 transition-opacity"
                                >
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="font-medium text-stone-300" x-text="call.elder_name"></span>
                                        <span class="text-xs text-stone-500" x-text="call.status === 'ended' ? 'Finalizada' : 'Fallida'"></span>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Right Panel: Call Detail View -->
                <div class="lg:col-span-2">
                    <template x-if="!selectedCall">
                        <div class="card h-full flex items-center justify-center py-16">
                            <div class="text-center text-stone-500">
                                <div class="text-5xl mb-4">📞</div>
                                <p>Selecciona una llamada para ver los detalles</p>
                                <p class="text-sm mt-2">o inicia una nueva llamada</p>
                            </div>
                        </div>
                    </template>

                    <template x-if="selectedCall">
                        <div class="card h-full flex flex-col">
                            <!-- Call Header -->
                            <div class="card-header border-b border-surface-700/50 pb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-full bg-primary-500/20 flex items-center justify-center text-2xl">👴</div>
                                    <div>
                                        <h2 class="text-lg font-display font-semibold text-stone-100" x-text="selectedCall.elder_name"></h2>
                                        <div class="flex items-center gap-3 text-sm text-stone-500">
                                            <span x-text="selectedCall.elder_phone"></span>
                                            <span>•</span>
                                            <span x-text="formatDuration(selectedCall.started_at)"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="badge" :class="selectedCall.voice_provider === 'elevenlabs' ? 'badge-purple' : 'badge-blue'"
                                          x-text="voiceProviderLabel(selectedCall.voice_provider)"></span>
                                    <span class="badge" :class="{
                                        'badge-green': selectedCall.status === 'active',
                                        'badge-yellow': selectedCall.status === 'connecting',
                                        'badge-stone': selectedCall.status === 'ended',
                                        'badge-red': selectedCall.status === 'failed'
                                    }" x-text="statusLabel(selectedCall.status)"></span>
                                </div>
                            </div>

                            <!-- Tabs -->
                            <div class="flex border-b border-surface-700/50">
                                <button 
                                    @click="activeTab = 'transcript'" 
                                    class="px-4 py-2 text-sm font-medium transition-colors"
                                    :class="activeTab === 'transcript' ? 'text-primary-400 border-b-2 border-primary-400' : 'text-stone-400 hover:text-stone-200'"
                                >
                                    Transcripción
                                </button>
                                <button 
                                    @click="activeTab = 'tools'" 
                                    class="px-4 py-2 text-sm font-medium transition-colors"
                                    :class="activeTab === 'tools' ? 'text-primary-400 border-b-2 border-primary-400' : 'text-stone-400 hover:text-stone-200'"
                                >
                                    Herramientas 
                                    <span class="ml-1 text-xs" x-show="selectedCall.tool_calls.length > 0" x-text="'(' + selectedCall.tool_calls.length + ')'"></span>
                                </button>
                            </div>

                            <!-- Tab Content -->
                            <div class="flex-1 overflow-hidden">
                                <!-- Transcript Tab -->
                                <div x-show="activeTab === 'transcript'" class="h-full overflow-y-auto p-4 space-y-3" x-ref="transcriptScroll">
                                    <template x-if="selectedCall.transcript.length === 0">
                                        <div class="text-center text-stone-500 py-8">
                                            <p>Esperando transcripción...</p>
                                        </div>
                                    </template>
                                    
                                    <template x-for="(entry, idx) in selectedCall.transcript" :key="idx">
                                        <div class="flex gap-3" :class="entry.speaker === 'user' ? 'flex-row-reverse' : ''">
                                            <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-sm"
                                                 :class="entry.speaker === 'user' ? 'bg-sky-500/20' : 'bg-primary-500/20'">
                                                <span x-text="entry.speaker === 'user' ? '👴' : '🤖'"></span>
                                            </div>
                                            <div class="max-w-[80%] p-3 rounded-lg"
                                                 :class="entry.speaker === 'user' 
                                                    ? 'bg-sky-500/10 border border-sky-500/20' 
                                                    : 'bg-surface-800 border border-surface-700'">
                                                <p class="text-sm text-stone-200" x-text="entry.text"></p>
                                                <p class="text-xs text-stone-500 mt-1" :class="entry.is_partial ? 'italic' : ''">
                                                    <span x-text="entry.is_partial ? 'escribiendo...' : formatTime(entry.timestamp)"></span>
                                                </p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Tools Tab -->
                                <div x-show="activeTab === 'tools'" class="h-full overflow-y-auto p-4 space-y-3">
                                    <template x-if="selectedCall.tool_calls.length === 0">
                                        <div class="text-center text-stone-500 py-8">
                                            <p>No se han ejecutado herramientas aún</p>
                                        </div>
                                    </template>
                                    
                                    <template x-for="(tool, idx) in selectedCall.tool_calls" :key="idx">
                                        <div class="bg-surface-800/50 border border-surface-700/50 rounded-lg overflow-hidden">
                                            <div class="px-3 py-2 bg-surface-800 border-b border-surface-700/50 flex items-center justify-between">
                                                <div class="flex items-center gap-2">
                                                    <span class="text-primary-400">⚡</span>
                                                    <span class="font-mono text-sm text-stone-200" x-text="tool.name"></span>
                                                </div>
                                                <span class="text-xs text-stone-500" x-text="formatTime(tool.timestamp)"></span>
                                            </div>
                                            <div class="p-3 space-y-2">
                                                <div>
                                                    <p class="text-xs text-stone-500 mb-1">Argumentos:</p>
                                                    <pre class="text-xs text-stone-300 bg-surface-900 p-2 rounded overflow-x-auto" x-text="formatJson(tool.arguments)"></pre>
                                                </div>
                                                <template x-if="tool.result">
                                                    <div>
                                                        <p class="text-xs text-stone-500 mb-1">Resultado:</p>
                                                        <pre class="text-xs text-emerald-300 bg-surface-900 p-2 rounded overflow-x-auto" x-text="formatJson(tool.result)"></pre>
                                                    </div>
                                                </template>
                                                <template x-if="!tool.result">
                                                    <div class="flex items-center gap-2 text-yellow-400 text-xs">
                                                        <span class="animate-pulse">●</span>
                                                        <span>Ejecutando...</span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
function callCenter() {
    return {
        connected: false,
        calls: [],
        elders: [],
        selectedCallSid: null,
        activeTab: 'transcript',
        callForm: { elder_id: '', voice_provider: 'openai_realtime' },
        calling: false,
        callError: null,
        eventSource: null,
        callEventSource: null,

        get activeCalls() {
            return this.calls.filter(c => c.status === 'active' || c.status === 'connecting');
        },

        get endedCalls() {
            return this.calls.filter(c => c.status === 'ended' || c.status === 'failed');
        },

        get selectedCall() {
            return this.calls.find(c => c.call_sid === this.selectedCallSid) || null;
        },

        async init() {
            await this.loadElders();
            await this.loadCalls();
            this.connectSSE();
        },

        async loadElders() {
            try {
                const res = await fetch('/api/admin/elders');
                if (res.ok) {
                    const data = await res.json();
                    this.elders = data.items || data || [];
                }
            } catch (e) {
                console.error('Failed to load elders:', e);
            }
        },

        async loadCalls() {
            try {
                const res = await fetch('/api/admin/calls');
                if (res.ok) {
                    this.calls = await res.json();
                }
            } catch (e) {
                console.error('Failed to load calls:', e);
            }
        },

        connectSSE() {
            this.eventSource = new EventSource('/api/admin/calls/live');
            
            this.eventSource.onopen = () => {
                this.connected = true;
                console.log('SSE connected');
            };

            this.eventSource.onerror = () => {
                this.connected = false;
                console.log('SSE error, reconnecting...');
                setTimeout(() => this.connectSSE(), 3000);
            };

            this.eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                this.handleEvent(data);
            };
        },

        handleEvent(event) {
            console.log('SSE event:', event);
            
            switch (event.type) {
                case 'call_started':
                    this.calls.unshift({
                        call_sid: event.call_sid,
                        elder_id: event.elder_id,
                        elder_name: event.elder_name,
                        elder_phone: event.elder_phone,
                        voice_provider: event.voice_provider || 'openai_realtime',
                        status: 'connecting',
                        started_at: new Date().toISOString(),
                        transcript: [],
                        tool_calls: []
                    });
                    // Auto-select the new call
                    this.selectCall(event.call_sid);
                    break;

                case 'status_changed':
                    this.updateCall(event.call_sid, { status: event.status });
                    break;

                case 'transcript':
                    this.addTranscript(event.call_sid, event);
                    break;

                case 'tool_call_started':
                    this.addToolCall(event.call_sid, event);
                    break;

                case 'tool_call_completed':
                    this.completeToolCall(event.call_sid, event.id, event.result);
                    break;

                case 'call_ended':
                    this.updateCall(event.call_sid, { 
                        status: 'ended',
                        ended_at: new Date().toISOString()
                    });
                    break;
            }
        },

        updateCall(callSid, updates) {
            const idx = this.calls.findIndex(c => c.call_sid === callSid);
            if (idx !== -1) {
                this.calls[idx] = { ...this.calls[idx], ...updates };
            }
        },

        addTranscript(callSid, event) {
            const call = this.calls.find(c => c.call_sid === callSid);
            if (!call) return;

            // If partial and same speaker, update last entry
            if (event.is_partial && call.transcript.length > 0) {
                const last = call.transcript[call.transcript.length - 1];
                if (last.speaker === event.speaker && last.is_partial) {
                    last.text = event.text;
                    return;
                }
            }

            call.transcript.push({
                speaker: event.speaker,
                text: event.text,
                timestamp: new Date().toISOString(),
                is_partial: event.is_partial
            });

            // Auto-scroll transcript
            this.$nextTick(() => {
                const el = this.$refs.transcriptScroll;
                if (el) el.scrollTop = el.scrollHeight;
            });
        },

        addToolCall(callSid, event) {
            const call = this.calls.find(c => c.call_sid === callSid);
            if (!call) return;

            call.tool_calls.push({
                id: event.id,
                name: event.name,
                arguments: event.arguments,
                result: null,
                timestamp: new Date().toISOString()
            });
        },

        completeToolCall(callSid, toolId, result) {
            const call = this.calls.find(c => c.call_sid === callSid);
            if (!call) return;

            const tool = call.tool_calls.find(t => t.id === toolId);
            if (tool) {
                tool.result = result;
            }
        },

        selectCall(callSid) {
            this.selectedCallSid = callSid;
            this.activeTab = 'transcript';
        },

        async initiateCall() {
            if (!this.callForm.elder_id) return;
            
            this.calling = true;
            this.callError = null;
            
            try {
                const res = await fetch('/debug/call-elder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.callForm)
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    this.callError = data.error || 'Error al iniciar llamada';
                } else {
                    this.callForm.elder_id = '';
                    this.callForm.voice_provider = 'openai_realtime';
                    // The SSE will handle adding the call to the list
                }
            } catch (e) {
                this.callError = 'Error de conexión';
            }
            
            this.calling = false;
        },

        formatDuration(startedAt) {
            const start = new Date(startedAt);
            const now = new Date();
            const secs = Math.floor((now - start) / 1000);
            const mins = Math.floor(secs / 60);
            const remainingSecs = secs % 60;
            return `${mins}:${remainingSecs.toString().padStart(2, '0')}`;
        },

        formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('es-MX', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
        },

        formatJson(str) {
            try {
                return JSON.stringify(JSON.parse(str), null, 2);
            } catch {
                return str;
            }
        },

        statusLabel(status) {
            const labels = {
                'connecting': 'Conectando',
                'active': 'En curso',
                'ended': 'Finalizada',
                'failed': 'Fallida'
            };
            return labels[status] || status;
        },

        voiceProviderLabel(provider) {
            const labels = {
                'openai_realtime': 'GPT-Realtime',
                'elevenlabs': 'ElevenLabs'
            };
            return labels[provider] || provider || 'GPT-Realtime';
        }
    }
}
</script>
{% endblock %}
