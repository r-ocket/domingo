{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-slate-950">
    {% include "partials/sidebar.html" %}
    
    <main class="transition-all duration-300" :class="sidebarOpen ? 'ml-64' : 'ml-20'">
        <div class="p-8" x-data="eldersAdmin()">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-white">Elders</h1>
                    <p class="text-slate-400 mt-1">Manage all elder profiles</p>
                </div>
                <div class="flex gap-4">
                    <input type="search" x-model="searchQuery" @input="search()" placeholder="Search by name or phone..."
                        class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 w-64">
                </div>
            </div>

            <!-- Elders Table -->
            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Phone</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Caregiver</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Last Call</th>
                            <th class="px-6 py-4 text-right text-xs font-semibold text-slate-400 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        <template x-for="elder in elders" :key="elder.id">
                            <tr class="hover:bg-slate-800/30 transition-colors">
                                <td class="px-6 py-4 text-sm font-medium text-white" x-text="elder.name"></td>
                                <td class="px-6 py-4 text-sm text-slate-400" x-text="elder.phone_number"></td>
                                <td class="px-6 py-4 text-sm text-slate-400" x-text="elder.caregiver_name"></td>
                                <td class="px-6 py-4">
                                    <span class="badge" :class="elder.status === 'active' ? 'badge-green' : 'badge-yellow'" x-text="elder.status"></span>
                                </td>
                                <td class="px-6 py-4 text-sm text-slate-400" x-text="formatDate(elder.last_call_at)"></td>
                                <td class="px-6 py-4 text-right space-x-2">
                                    <button @click="viewElder(elder)" class="text-sm text-primary-400 hover:text-primary-300">View</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div x-show="totalPages > 1" class="mt-6 flex justify-center gap-2">
                <button @click="page = Math.max(1, page - 1); load()" :disabled="page === 1" class="btn btn-ghost btn-sm">Previous</button>
                <span class="px-4 py-2 text-sm text-slate-400" x-text="`Page ${page} of ${totalPages}`"></span>
                <button @click="page = Math.min(totalPages, page + 1); load()" :disabled="page === totalPages" class="btn btn-ghost btn-sm">Next</button>
            </div>
        </div>
    </main>
</div>

<script>
function eldersAdmin() {
    return {
        elders: [],
        page: 1,
        totalPages: 1,
        searchQuery: '',
        searchTimeout: null,
        
        async init() {
            await this.load();
        },
        
        async load() {
            const params = new URLSearchParams({ page: this.page });
            if (this.searchQuery) params.set('q', this.searchQuery);
            const res = await fetch(`/api/admin/elders?${params}`);
            const data = await res.json();
            this.elders = data.items || [];
            this.totalPages = data.total_pages || 1;
        },
        
        search() {
            clearTimeout(this.searchTimeout);
            this.searchTimeout = setTimeout(() => {
                this.page = 1;
                this.load();
            }, 300);
        },
        
        viewElder(elder) {
            window.location.href = `/admin/elders/${elder.id}`;
        },
        
        formatDate(dateStr) {
            if (!dateStr) return 'Never';
            return new Date(dateStr).toLocaleString();
        }
    };
}
</script>
{% endblock %}
