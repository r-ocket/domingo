{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-slate-950">
    {% include "partials/sidebar.html" %}
    
    <main class="transition-all duration-300" :class="sidebarOpen ? 'ml-64' : 'ml-20'">
        <div class="p-8" x-data="systemLogs()">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-white">System Logs</h1>
                    <p class="text-slate-400 mt-1">View all system activity</p>
                </div>
                <div class="flex gap-4">
                    <select x-model="logType" @change="load()" class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="all">All Types</option>
                        <option value="calls">Calls</option>
                        <option value="rides">Rides</option>
                        <option value="reminders">Reminders</option>
                        <option value="errors">Errors</option>
                    </select>
                    <button @click="load()" class="btn btn-ghost">🔄 Refresh</button>
                </div>
            </div>

            <!-- Logs Table -->
            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Timestamp</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Type</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Elder</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Description</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        <template x-for="log in logs" :key="log.id">
                            <tr class="hover:bg-slate-800/30 transition-colors">
                                <td class="px-6 py-4 text-sm text-slate-400" x-text="formatDate(log.timestamp)"></td>
                                <td class="px-6 py-4">
                                    <span class="badge" :class="{
                                        'badge-blue': log.type === 'call',
                                        'badge-purple': log.type === 'ride',
                                        'badge-yellow': log.type === 'reminder',
                                        'badge-red': log.type === 'error'
                                    }" x-text="log.type"></span>
                                </td>
                                <td class="px-6 py-4 text-sm text-white" x-text="log.elder_name || '-'"></td>
                                <td class="px-6 py-4 text-sm text-slate-300" x-text="log.description"></td>
                                <td class="px-6 py-4">
                                    <span class="badge" :class="{
                                        'badge-green': log.status === 'success' || log.status === 'completed',
                                        'badge-yellow': log.status === 'pending' || log.status === 'in_progress',
                                        'badge-red': log.status === 'failed' || log.status === 'error'
                                    }" x-text="log.status"></span>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="logs.length === 0">
                            <td colspan="5" class="px-6 py-12 text-center text-slate-500">
                                No logs found
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div x-show="totalPages > 1" class="mt-6 flex justify-center gap-2">
                <button @click="page = Math.max(1, page - 1); load()" :disabled="page === 1" class="btn btn-ghost btn-sm">Previous</button>
                <span class="px-4 py-2 text-sm text-slate-400" x-text="`Page ${page} of ${totalPages}`"></span>
                <button @click="page = Math.min(totalPages, page + 1); load()" :disabled="page === totalPages" class="btn btn-ghost btn-sm">Next</button>
            </div>
        </div>
    </main>
</div>

<script>
function systemLogs() {
    return {
        logs: [],
        page: 1,
        totalPages: 1,
        logType: 'all',
        
        async init() {
            await this.load();
        },
        
        async load() {
            const params = new URLSearchParams({ page: this.page });
            if (this.logType !== 'all') params.set('type', this.logType);
            const res = await fetch(`/api/admin/logs?${params}`);
            const data = await res.json();
            this.logs = data.items || [];
            this.totalPages = data.total_pages || 1;
        },
        
        formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString();
        }
    };
}
</script>
{% endblock %}
