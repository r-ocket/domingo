{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-slate-950">
    {% include "partials/sidebar.html" %}
    
    <main class="transition-all duration-300" :class="sidebarOpen ? 'ml-64' : 'ml-20'">
        <div class="p-8" x-data="rideLogs('{{ elder_id }}')">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-white">Ride Logs</h1>
                    <p class="text-slate-400 mt-1">View ride request history</p>
                </div>
                <button @click="loadLogs" class="btn btn-ghost">🔄 Refresh</button>
            </div>

            <!-- Rides List -->
            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Destination</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Driver</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Duration</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        <template x-for="ride in rides" :key="ride.id">
                            <tr class="hover:bg-slate-800/30 transition-colors">
                                <td class="px-6 py-4 text-sm text-slate-300" x-text="formatDate(ride.requested_at)"></td>
                                <td class="px-6 py-4 text-sm text-white" x-text="ride.destination_name || ride.destination_address"></td>
                                <td class="px-6 py-4">
                                    <span class="badge" :class="{
                                        'badge-green': ride.status === 'completed',
                                        'badge-blue': ride.status === 'in_progress' || ride.status === 'driver_en_route',
                                        'badge-yellow': ride.status === 'requested',
                                        'badge-red': ride.status === 'cancelled' || ride.status === 'failed'
                                    }" x-text="ride.status"></span>
                                </td>
                                <td class="px-6 py-4 text-sm text-slate-400">
                                    <span x-text="ride.driver_name || '-'"></span>
                                </td>
                                <td class="px-6 py-4 text-sm text-slate-400" x-text="formatDuration(ride.duration_minutes)"></td>
                            </tr>
                        </template>
                        <tr x-show="rides.length === 0">
                            <td colspan="5" class="px-6 py-12 text-center text-slate-500">
                                No rides yet
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div x-show="totalPages > 1" class="mt-6 flex justify-center gap-2">
                <button @click="page = Math.max(1, page - 1); loadLogs()" :disabled="page === 1" class="btn btn-ghost btn-sm">Previous</button>
                <span class="px-4 py-2 text-sm text-slate-400" x-text="`Page ${page} of ${totalPages}`"></span>
                <button @click="page = Math.min(totalPages, page + 1); loadLogs()" :disabled="page === totalPages" class="btn btn-ghost btn-sm">Next</button>
            </div>
        </div>
    </main>
</div>

<script>
function rideLogs(elderId) {
    return {
        elderId,
        rides: [],
        page: 1,
        totalPages: 1,
        
        async init() {
            await this.loadLogs();
        },
        
        async loadLogs() {
            const res = await fetch(`/api/elder/${this.elderId}/logs/rides?page=${this.page}`);
            const data = await res.json();
            this.rides = data.items || [];
            this.totalPages = data.total_pages || 1;
        },
        
        formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString();
        },
        
        formatDuration(mins) {
            if (!mins) return '-';
            return `${mins} min`;
        }
    };
}
</script>
{% endblock %}
