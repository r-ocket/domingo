{% extends "base.html" %}

{% block content %}
<div class="app-layout">
    {% include "partials/sidebar.html" %}
    
    <main class="main-content">
        <header class="page-header">
            <h1>Reminder Logs</h1>
        </header>

        <div x-data="logsManager('{{ elder_id }}', 'reminder-logs')" class="content-area">
            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Medication</th>
                            <th>Method</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="log in logs" :key="log.id">
                            <tr>
                                <td x-text="formatDate(log.timestamp)"></td>
                                <td x-text="log.medication_name"></td>
                                <td x-text="log.delivery_method"></td>
                                <td>
                                    <span class="badge" :class="'badge-' + log.status" x-text="log.status"></span>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="logs.length === 0">
                            <td colspan="4" class="empty-row">No reminder logs yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="pagination" x-show="totalPages > 1">
                <button class="btn btn-sm" @click="prevPage" :disabled="page === 1">Previous</button>
                <span x-text="'Page ' + page + ' of ' + totalPages"></span>
                <button class="btn btn-sm" @click="nextPage" :disabled="page >= totalPages">Next</button>
            </div>
        </div>
    </main>
</div>

<script>
function logsManager(elderId, type) {
    return {
        elderId,
        type,
        logs: [],
        page: 1,
        totalPages: 1,
        
        async init() {
            await this.loadLogs();
        },
        
        async loadLogs() {
            const res = await fetch(`/api/elder/${this.elderId}/${this.type}?page=${this.page}`);
            const data = await res.json();
            this.logs = data.items || [];
            this.totalPages = data.total_pages || 1;
        },
        
        prevPage() {
            if (this.page > 1) {
                this.page--;
                this.loadLogs();
            }
        },
        
        nextPage() {
            if (this.page < this.totalPages) {
                this.page++;
                this.loadLogs();
            }
        },
        
        formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString();
        }
    };
}
</script>
{% endblock %}
