{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="text-4xl">🤖</span>
            </div>
            <h1 class="auth-title">Bienvenido de vuelta</h1>
            <p class="auth-subtitle">Inicia sesión en tu cuenta de Walle</p>
        </div>

        <div class="auth-form">
            <form hx-post="/login" 
                  hx-target="#form-errors" 
                  hx-swap="innerHTML"
                  @htmx:after-request="if(event.detail.successful && !event.detail.xhr.response) window.location.href = '/dashboard'"
                  class="space-y-4">
                <div id="form-errors"></div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" required autofocus 
                           placeholder="tu@ejemplo.com" class="form-input">
                    </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="••••••••" class="form-input">
                </div>
                
                <button type="submit" class="btn btn-primary w-full">Iniciar Sesión</button>
            </form>
        </div>

        <p class="auth-footer">
            ¿No tienes cuenta? <a href="/register" class="auth-link">Crear una</a>
        </p>
    </div>
</div>
{% endblock %}
