{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2">
                <span class="text-3xl">🤖</span>
                <span class="text-2xl font-bold text-white">Walle</span>
            </a>
            <h1 class="mt-6 text-2xl font-bold text-white">Welcome Back</h1>
            <p class="mt-2 text-slate-400">Sign in to manage your elder's care</p>
        </div>

        <div class="bg-slate-800/50 rounded-2xl p-8 border border-slate-700/50 backdrop-blur">
            <form x-data="{ loading: false, error: '' }" @submit.prevent="
                loading = true;
                error = '';
                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: $refs.email.value,
                        password: $refs.password.value
                    })
                })
                .then(r => r.json().then(data => ({ ok: r.ok, data })))
                .then(({ ok, data }) => {
                    loading = false;
                    if (ok) {
                        window.location.href = '/dashboard';
                    } else {
                        error = data.error || 'Login failed';
                    }
                })
                .catch(e => {
                    loading = false;
                    error = 'Network error. Please try again.';
                });
            ">
                <div class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
                        <input type="email" id="email" x-ref="email" required placeholder="you@example.com"
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                        <input type="password" id="password" x-ref="password" required placeholder="••••••••"
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                    </div>

                    <div x-show="error" class="p-3 bg-red-500/10 border border-red-500/20 rounded-lg">
                        <p class="text-sm text-red-400" x-text="error"></p>
                    </div>

                    <button type="submit" :disabled="loading"
                        class="w-full bg-primary-600 hover:bg-primary-500 disabled:bg-primary-600/50 text-white py-3 rounded-lg font-semibold transition-colors">
                        <span x-show="!loading">Sign In</span>
                        <span x-show="loading">Signing in...</span>
                    </button>
                </div>
            </form>
        </div>

        <p class="mt-6 text-center text-slate-400">
            Don't have an account? <a href="/register" class="text-primary-400 hover:text-primary-300 font-medium">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
