<div x-data="{ open: true }" x-show="open" class="modal-container" @keydown.escape.window="open = false">
    <div class="modal-backdrop" @click="open = false"></div>
    
    <div class="modal">
        <h2 class="modal-title">Edit Location</h2>
        
        <form hx-put="/elder/locations/{{ location.id }}" 
              hx-target="#location-{{ location.id }}" 
              hx-swap="outerHTML"
              @htmx:after-request="if(event.detail.successful) { open = false }"
              class="modal-body">
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" name="name" value="{{ location.name }}" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Address</label>
                <textarea name="address" required rows="2" class="form-textarea">{{ location.address }}</textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Extra Instructions (optional)</label>
                <textarea name="extra_instructions" rows="2" class="form-textarea">{{ location.extra_instructions | default(value="") }}</textarea>
            </div>
            <div class="form-group">
                <label class="flex items-center gap-3">
                    <input type="checkbox" name="is_home" value="true" {% if location.is_home %}checked{% endif %} class="form-checkbox">
                    <span class="text-sm text-stone-300">This is the home address</span>
                </label>
            </div>
            
            <div class="modal-footer">
                <button type="button" @click="open = false" class="btn btn-ghost">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
