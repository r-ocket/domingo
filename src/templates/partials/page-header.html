<header class="page-header">
    <div>
        <h1 class="page-title">{{ page_title }}</h1>
        {% if page_subtitle %}
        <p class="page-subtitle">{{ page_subtitle }}</p>
        {% endif %}
    </div>
    {% if page_actions %}
    <div class="page-actions">
        {{ page_actions | safe }}
    </div>
    {% endif %}
</header>
