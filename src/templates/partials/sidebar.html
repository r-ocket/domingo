<aside class="sidebar" :class="sidebarOpen ? 'open' : 'collapsed'">
    <!-- Header -->
    <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
            <span class="text-2xl">🤖</span>
            <span class="sidebar-brand-text" x-show="sidebarOpen" x-transition.opacity>Walle</span>
        </a>
        <button @click="sidebarOpen = !sidebarOpen" class="sidebar-toggle">
            <svg x-show="sidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            <svg x-show="!sidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item {% if current_path == '/dashboard' %}active{% endif %}">
            <span class="nav-item-icon">📊</span>
            <span x-show="sidebarOpen" x-transition.opacity>Panel Principal</span>
        </a>
        <a href="/elder/profile" class="nav-item {% if current_path == '/elder/profile' %}active{% endif %}">
            <span class="nav-item-icon">👤</span>
            <span x-show="sidebarOpen" x-transition.opacity>Perfil del Adulto Mayor</span>
        </a>
        <a href="/elder/contacts" class="nav-item {% if current_path == '/elder/contacts' %}active{% endif %}">
            <span class="nav-item-icon">👥</span>
            <span x-show="sidebarOpen" x-transition.opacity>Contactos</span>
        </a>
        <a href="/elder/locations" class="nav-item {% if current_path == '/elder/locations' %}active{% endif %}">
            <span class="nav-item-icon">📍</span>
            <span x-show="sidebarOpen" x-transition.opacity>Ubicaciones</span>
        </a>
        <a href="/elder/medications" class="nav-item {% if current_path == '/elder/medications' %}active{% endif %}">
            <span class="nav-item-icon">💊</span>
            <span x-show="sidebarOpen" x-transition.opacity>Medicamentos</span>
        </a>
        
        <div class="sidebar-section">
            <p class="sidebar-section-title" x-show="sidebarOpen" x-transition.opacity>Historial</p>
        </div>
        
        <a href="/elder/logs/calls" class="nav-item {% if current_path == '/elder/logs/calls' %}active{% endif %}">
            <span class="nav-item-icon">📞</span>
            <span x-show="sidebarOpen" x-transition.opacity>Llamadas</span>
        </a>
        <a href="/elder/logs/rides" class="nav-item {% if current_path == '/elder/logs/rides' %}active{% endif %}">
            <span class="nav-item-icon">🚗</span>
            <span x-show="sidebarOpen" x-transition.opacity>Viajes</span>
        </a>
        <a href="/elder/logs/reminders" class="nav-item {% if current_path == '/elder/logs/reminders' %}active{% endif %}">
            <span class="nav-item-icon">⏰</span>
            <span x-show="sidebarOpen" x-transition.opacity>Recordatorios</span>
        </a>
        
        <div class="sidebar-section">
            <a href="/billing" class="nav-item {% if current_path == '/billing' %}active{% endif %}">
                <span class="nav-item-icon">💳</span>
                <span x-show="sidebarOpen" x-transition.opacity>Facturación</span>
            </a>
        </div>
        
        {% if is_admin %}
        <div class="sidebar-section">
            <p class="sidebar-section-title" x-show="sidebarOpen" x-transition.opacity>Administrador</p>
            <a href="/admin" class="nav-item {% if current_path == '/admin' %}active{% endif %}">
                <span class="nav-item-icon">📈</span>
                <span x-show="sidebarOpen" x-transition.opacity>Panel Admin</span>
            </a>
            <a href="/admin/caregivers" class="nav-item {% if current_path == '/admin/caregivers' %}active{% endif %}">
                <span class="nav-item-icon">👤</span>
                <span x-show="sidebarOpen" x-transition.opacity>Cuidadores</span>
            </a>
            <a href="/admin/elders" class="nav-item {% if current_path == '/admin/elders' %}active{% endif %}">
                <span class="nav-item-icon">👴</span>
                <span x-show="sidebarOpen" x-transition.opacity>Adultos Mayores</span>
            </a>
            <a href="/admin/logs" class="nav-item {% if current_path == '/admin/logs' %}active{% endif %}">
                <span class="nav-item-icon">📋</span>
                <span x-show="sidebarOpen" x-transition.opacity>Registros del Sistema</span>
            </a>
            <a href="/admin/debug" class="nav-item {% if current_path == '/admin/debug' %}active{% endif %}">
                <span class="nav-item-icon">🔧</span>
                <span x-show="sidebarOpen" x-transition.opacity>Herramientas Debug</span>
            </a>
        </div>
        {% endif %}
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
        <button @click="fetch('/api/auth/logout', { method: 'POST' }).then(() => window.location.href = '/login')"
                class="nav-item w-full">
            <span class="nav-item-icon">🚪</span>
            <span x-show="sidebarOpen" x-transition.opacity>Cerrar Sesión</span>
        </button>
    </div>
</aside>
