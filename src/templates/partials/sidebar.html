<aside class="sidebar" :class="sidebarOpen ? 'open' : 'collapsed'">
    <!-- Header -->
    <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
            <span class="text-2xl">🤖</span>
            <span class="sidebar-brand-text" x-show="sidebarOpen" x-transition.opacity>Walle</span>
        </a>
        <button @click="sidebarOpen = !sidebarOpen" class="sidebar-toggle">
            <svg x-show="sidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            <svg x-show="!sidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
            <span class="nav-item-icon">📊</span>
            <span x-show="sidebarOpen" x-transition.opacity>Dashboard</span>
        </a>
        <a href="/elder/profile" class="nav-item">
            <span class="nav-item-icon">👤</span>
            <span x-show="sidebarOpen" x-transition.opacity>Elder Profile</span>
        </a>
        <a href="/elder/contacts" class="nav-item">
            <span class="nav-item-icon">👥</span>
            <span x-show="sidebarOpen" x-transition.opacity>Contacts</span>
        </a>
        <a href="/elder/locations" class="nav-item">
            <span class="nav-item-icon">📍</span>
            <span x-show="sidebarOpen" x-transition.opacity>Locations</span>
        </a>
        <a href="/elder/medications" class="nav-item">
            <span class="nav-item-icon">💊</span>
            <span x-show="sidebarOpen" x-transition.opacity>Medications</span>
        </a>
        
        <div class="sidebar-section">
            <p class="sidebar-section-title" x-show="sidebarOpen" x-transition.opacity>Logs</p>
        </div>
        
        <a href="/elder/logs/calls" class="nav-item">
            <span class="nav-item-icon">📞</span>
            <span x-show="sidebarOpen" x-transition.opacity>Call Logs</span>
        </a>
        <a href="/elder/logs/rides" class="nav-item">
            <span class="nav-item-icon">🚗</span>
            <span x-show="sidebarOpen" x-transition.opacity>Ride Logs</span>
        </a>
        <a href="/elder/logs/reminders" class="nav-item">
            <span class="nav-item-icon">⏰</span>
            <span x-show="sidebarOpen" x-transition.opacity>Reminders</span>
        </a>
        
        <div class="sidebar-section">
            <a href="/billing" class="nav-item">
                <span class="nav-item-icon">💳</span>
                <span x-show="sidebarOpen" x-transition.opacity>Billing</span>
            </a>
        </div>
        
        {% if is_admin %}
        <div class="sidebar-section">
            <p class="sidebar-section-title" x-show="sidebarOpen" x-transition.opacity>Admin</p>
            <a href="/admin" class="nav-item">
                <span class="nav-item-icon">📈</span>
                <span x-show="sidebarOpen" x-transition.opacity>Dashboard</span>
            </a>
            <a href="/admin/caregivers" class="nav-item">
                <span class="nav-item-icon">👤</span>
                <span x-show="sidebarOpen" x-transition.opacity>Caregivers</span>
            </a>
            <a href="/admin/elders" class="nav-item">
                <span class="nav-item-icon">👴</span>
                <span x-show="sidebarOpen" x-transition.opacity>Elders</span>
            </a>
            <a href="/admin/logs" class="nav-item">
                <span class="nav-item-icon">📋</span>
                <span x-show="sidebarOpen" x-transition.opacity>System Logs</span>
            </a>
        </div>
        {% endif %}
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
        <button @click="fetch('/api/auth/logout', { method: 'POST' }).then(() => window.location.href = '/login')"
                class="nav-item w-full">
            <span class="nav-item-icon">🚪</span>
            <span x-show="sidebarOpen" x-transition.opacity>Logout</span>
        </button>
    </div>
</aside>
