{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="text-4xl">🤖</span>
            </div>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Start caring for your elder with Walle</p>
        </div>
        
        <div class="auth-form">
            <form hx-post="/register" 
                  hx-target="#form-errors" 
                  hx-swap="innerHTML"
                  @htmx:after-request="if(event.detail.successful && !event.detail.xhr.response) window.location.href = '/dashboard'"
                  class="space-y-4">
                <div id="form-errors"></div>
                
                <div class="form-group">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" id="name" name="name" required autofocus 
                           placeholder="Jane Doe" class="form-input">
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" required 
                           placeholder="you@example.com" class="form-input">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" required minlength="8"
                           placeholder="At least 8 characters" class="form-input">
                </div>
                
                <button type="submit" class="btn btn-primary w-full">Create Account</button>
                
                <p class="text-xs text-stone-500 text-center">
                    By creating an account, you agree to our Terms of Service and Privacy Policy.
                </p>
            </form>
        </div>
        
        <p class="auth-footer">
            Already have an account? <a href="/login" class="auth-link">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
