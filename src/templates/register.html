{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="text-4xl">🤖</span>
            </div>
            <h1 class="auth-title">Crea tu cuenta</h1>
            <p class="auth-subtitle">Comienza a cuidar a tu adulto mayor con Walle</p>
        </div>

        <div class="auth-form">
            <form hx-post="/api/auth/register" 
                  hx-ext="json-enc"
                  hx-target="#form-errors" 
                  hx-swap="innerHTML"
                  @htmx:after-request="if(event.detail.successful) window.location.href = '/login'"
                  class="space-y-4">
                <div id="form-errors"></div>
                
                <div class="form-group">
                    <label for="name" class="form-label">Tu Nombre</label>
                    <input type="text" id="name" name="name" required autofocus 
                           placeholder="María García" class="form-input">
                    </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" required 
                           placeholder="tu@ejemplo.com" class="form-input">
                    </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="8"
                           placeholder="Mínimo 8 caracteres" class="form-input">
                </div>
                
                <button type="submit" class="btn btn-primary w-full">Crear Cuenta</button>
                
                <p class="text-xs text-stone-500 text-center">
                    Al crear una cuenta, aceptas nuestros Términos de Servicio y Política de Privacidad.
                </p>
            </form>
        </div>

        <p class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login" class="auth-link">Iniciar sesión</a>
        </p>
    </div>
</div>
{% endblock %}
